# Dev config for the Coconut Development Authority (CDA) agency, used by ../../../start-dev.sh via
# CONFIG_PATH=config/cda/config.yaml. Checked into the repo — see
# backend/config.example.yaml for the full schema and every field's meaning.
# port/allowedOrigins here must match start-dev.sh's CONFIG_cda line
# (BE_PORT/FE_PORT).
port: "8083"
environment: development # dev-only local IdP; never set this in a real deployment
allowedOrigins: ["http://localhost:5176"]

db:
  driver: sqlite
  sqlite:
    path: ./cda_applications.db

artifactLoader:
  type: local
  local:
    root: ../../one-trade-artifacts/cda

# Native dev serves the frontend via its own Vite dev server (start_frontend in
# start-dev.sh), so the backend stays API-only — dir points at a path that
# won't exist. It still serves /config.js from runtime below: the Vite dev
# server proxies /config.js to this backend (see frontend/vite.config.ts), so
# dev and prod share this one source of frontend runtime config/branding.
web:
  dir: /nonexistent

  runtime:
    apiBaseURL: http://localhost:8083
    idpBaseURL: https://localhost:8090
    idpClientID: OGA_PORTAL_APP_CDA
    idpExpectedOU: cda
    appURL: http://localhost:5176
    # Only scopes requested here are granted, regardless of what the role
    # permits. Keep in sync with frontend/.env.example.
    idpScopes: openid,profile,email,ou,role,agency:application:read,agency:application:review,agency:application:feedback,agency:consignment:read,agency:storage:read,agency:storage:write
    # The `resource` value must equal authn.audience above, or the agency:*
    # scopes are dropped from the issued token.
    idpExtraQueryParams: resource=https://api.nsw-agency.local

  branding:
    systemName: NSW
    appName: "Coconut Development Authority (CDA)"

authn:
  jwksURL: https://localhost:8090/oauth2/jwks
  issuer: https://localhost:8090
  audience: https://api.nsw-agency.local
  # The SPA portal client plus the inbound NSW->Agency m2m client (so NSW core
  # can call /api/v1/inject).
  clientIDs: ["OGA_PORTAL_APP_CDA", "NSW_TO_CDA"]
  expectedOU: cda
  insecureSkipTLSVerify: true # dev-only local IdP; never set this in a real deployment

nsw:
  baseURL: http://localhost:8080
  clientID: CDA_TO_NSW
  clientSecret: "{{env:NSW_CLIENT_SECRET}}"
  tokenURL: https://localhost:8090/oauth2/token
  tokenParams:
    resource: ["https://api.nsw-srilanka.local"]
  scopes:
    - "nsw:task:write"
    - "nsw:consignment:read"
    - "nsw:storage:read"
    - "nsw:storage:write"
  tokenInsecureSkipVerify: true # dev-only local IdP; never set this in a real deployment
