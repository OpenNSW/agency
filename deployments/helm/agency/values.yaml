# Neutral defaults for the NSW Agency app.
#
# One image serves both the API and the officer portal, so this chart deploys a
# single release. Layer the example override file on top of these defaults:
#
#   helm install agency ./agency -f values-example.yaml
#
# The image, containerPort, env, and ingress/route settings are intentionally
# left as neutral defaults here and are filled in by the override file.

replicaCount: 1

image:
  # Published image. Override for local builds (see values-test.yaml).
  repository: ghcr.io/opennsw/agency
  # REQUIRED — no default. Set the app version to deploy per environment or at
  # install (--set image.tag=1.4.0). Chart rendering fails if this is empty.
  # appVersion is metadata only and is deliberately NOT used as the tag.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Pod-level security context (applies to the server and migration pods). The
# image runs under any UID, so leave this unset on clusters that assign one —
# an explicit UID outside the range they allow is rejected at admission. Where
# you pick the UID yourself, e.g.
#   runAsNonRoot: true
#   runAsUser: 1001   # must match the image's numeric USER
#   fsGroup: 1001
podSecurityContext: {}

# Container-level security context (applies to the server and migration
# containers), e.g.
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: true
#   capabilities:
#     drop: ["ALL"]
securityContext: {}

# Port the application container listens on (set per component).
containerPort: 8080

service:
  type: ClusterIP
  port: 80

# Environment variables (key-value map). Supports raw values and valueFrom maps.
env: {}

# Load environments from existing ConfigMaps or Secrets
envFrom: []

# ---------------------------------------------------------------------------
# App config (config.yaml) — rendered into a chart-managed ConfigMap and
# mounted read-only at configMountPath/config.yaml for the server and
# migration Job. Structure mirrors backend/config.example.yaml 1:1 (see that
# file for the full schema and every field's meaning) — this section IS
# config.yaml, just authored as Helm values so it gets the same -f layering
# and --set overrides as the rest of this chart, instead of a hand-maintained
# ConfigMap created out-of-band.
#
# SECRETS (db.postgres.password, nsw.clientSecret, artifactLoader.github.token,
# artifactLoader.s3.secretKey) must stay as "{{env:NAME}}" placeholders here —
# NEVER a literal secret value — resolved by the app at container startup from
# the env var named, which in turn must come from a Kubernetes Secret you
# create out-of-band (see the chart README) and reference below under `env`
# via valueFrom.secretKeyRef. Helm does not template "{{...}}" appearing
# inside values data (only files under templates/ go through Go's text/template),
# so these placeholders pass through to the rendered config.yaml verbatim, for
# the app's own placeholder expansion to resolve — not Helm's.
#
# Left empty by default — see values-example.yaml for a complete example.
config: {}

# Directory config.yaml (and any configFiles below) are mounted into. When
# `config` is set, this path is also used as CONFIG_PATH automatically
# (unless you set env.CONFIG_PATH yourself).
configMountPath: /app/config

# Extra static files config.yaml references by relative/absolute path — e.g.
# JSON Schemas or data-scope rules (see docs/consignment-custom-data.md,
# docs/data-scoping.md, and config.yaml's consignmentCustomDataSchemaPath /
# dataScopeRulesPath). These aren't baked into the image, so populate here if
# used. Each key becomes one file in the same ConfigMap as config.yaml,
# mounted alongside it at configMountPath — point the matching config.yaml
# path at configMountPath/<key>. Non-secret only. e.g.:
#   configFiles:
#     data-scope-rules.json: |
#       { "rules": [...] }
#   config:
#     dataScopeRulesPath: /app/config/data-scope-rules.json
configFiles: {}

# Database migration Job. Runs the /app/migrate binary from the SAME image as
# the server, as a Helm pre-install/pre-upgrade hook, so the schema is migrated
# before the new server rolls out. It reuses the env above for DB config.
# Off by default; enabled via the example override file.
migration:
  enabled: false
  command: ["/app/migrate", "up"]
  backoffLimit: 1

# Configuration for OpenShift Routes (enable per component)
route:
  enabled: false
  host: ""
  tls:
    enabled: true
    termination: edge

# Configuration for standard Kubernetes Ingress (enable per component)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # TLS termination at the ingress. Each entry: {secretName, hosts: []}. The
  # secretName must reference a kubernetes.io/tls Secret you create out-of-band.
  # Leave empty to serve HTTP only (or rely on the controller's default cert).
  tls: []

# Resource requests/limits. When HPA is enabled, CPU requests must be defined
# for the HPA to calculate utilization. Example:
#   resources:
#     requests:
#       cpu: 100m
#       memory: 256Mi
resources: {}

# Horizontal Pod Autoscaler. When enabled, Deployment spec.replicas is omitted
# so Helm upgrades do not override the HPA-managed replica count.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget. Requires at least 2 running/minReplicas to allow
# voluntary eviction without blocking node drains.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Volumes and mounts. "config" is reserved when `config`/`configFiles` above
# is set — the chart generates that volume/mount itself; naming one of your
# own entries "config" fails the render.
volumes: []
volumeMounts: []
