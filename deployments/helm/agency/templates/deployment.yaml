apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agency.fullname" . }}
  labels:
    {{- include "agency.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agency.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agency.selectorLabels" . | nindent 8 }}
      {{- if .Values.configFiles }}
      annotations:
        # Force a rollout when configFiles content changes, since the
        # Deployment otherwise has no reference to the ConfigMap's contents.
        checksum/config: {{ toYaml .Values.configFiles | sha256sum }}
      {{- end }}
    spec:
      {{- if .Values.configFiles }}
      {{- range .Values.volumes }}
      {{- if eq .name "config" }}
      {{- fail "volumes: \"config\" is reserved for the configFiles ConfigMap — rename this volume" }}
      {{- end }}
      {{- end }}
      {{- range .Values.volumeMounts }}
      {{- if eq .name "config" }}
      {{- fail "volumeMounts: \"config\" is reserved for the configFiles ConfigMap — rename this volumeMount" }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — set it per environment or at install (e.g. --set image.tag=1.4.0)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              {{- if kindIs "map" $value }}
              {{- toYaml $value | nindent 14 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if or .Values.configFiles .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.configFiles }}
            - name: config
              mountPath: {{ .Values.configFilesMountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.configFiles .Values.volumes }}
      volumes:
        {{- if .Values.configFiles }}
        - name: config
          configMap:
            name: {{ include "agency.fullname" . }}-config
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
