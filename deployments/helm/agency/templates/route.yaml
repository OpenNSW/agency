{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "agency.fullname" . }}
  labels:
    {{- include "agency.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "agency.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- if and .Values.route.tls .Values.route.tls.enabled }}
  tls:
    termination: {{ .Values.route.tls.termination | default "edge" | quote }}
    {{- if .Values.route.tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy | quote }}
    {{- else if eq (.Values.route.tls.termination | default "edge") "edge" }}
    insecureEdgeTerminationPolicy: Redirect
    {{- end }}
  {{- end }}
{{- end }}
