# Override values for the NSW Agency app (single image: API + officer portal).
#   helm install agency ./agency -f values-example.yaml
#
# One image now serves both the API and the SPA from one process and one port,
# so this is a single release (there is no separate frontend deployment).
#
# Most server config now lives in a config.yaml file (see
# backend/config.example.yaml), not env vars — mirrors backend/.env.example.
# This chart does not (yet) generate a ConfigMap from inline values for it;
# create one yourself and mount it with the generic volumes/volumeMounts
# below. NON-secret config goes in that ConfigMap's config.yaml; SECRETS
# (DB_PASSWORD, NSW_CLIENT_SECRET) are referenced from a Kubernetes Secret via
# config.yaml's "{{env:NAME}}" syntax (see backend/config.example.yaml) and must
# NEVER be written into the ConfigMap. Create both out-of-band, e.g.:
#   kubectl create secret generic agency-secrets \
#     --from-literal=db-password=... \
#     --from-literal=nsw-client-secret=... \
#     --from-literal=artifact-s3-access-key=... \
#     --from-literal=artifact-s3-secret-key=...
#   kubectl create configmap agency-config --from-file=config.yaml=./config.yaml
#
# The artifact-s3-* secret keys are only needed when the artifact loader uses
# S3/R2 with static credentials (see config.yaml's artifactLoader.s3 section).
#
# The https:// URLs and *ClientID / *OU values in config.yaml are placeholders
# — replace them with your environment's real IdP and NSW API endpoints.

replicaCount: 1

image:
  repository: ghcr.io/opennsw/agency
  # Required — pick the app version to deploy. There is no default; the chart
  # fails to render if this is unset (appVersion is metadata, not the image tag).
  tag: "0.1.0"

# The server listens here (matches PORT below and EXPOSE in the root Dockerfile).
# It serves both the API and the officer portal on this single port.
containerPort: 8081

service:
  type: ClusterIP
  port: 80

env:
  # Where cmd/server AND the migration Job (see migration.enabled below,
  # which reuses this same env/volumes) find config.yaml — the mount path
  # below. Everything else, including `environment` (DEV-ONLY: "development"
  # enables config.yaml's insecure-TLS escape hatches — never set this in a
  # real deployment) and the db section cmd/migrate also reads from it, lives
  # in that one file, not here.
  CONFIG_PATH: "/app/config/config.yaml"

  # Secrets config.yaml resolves via "{{env:NAME}}" (see backend/config.example.yaml).
  # SECRET — pulled from a Kubernetes Secret, never inlined.
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: db-password
  NSW_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: nsw-client-secret
  # Only needed if config.yaml's artifactLoader uses S3/R2 with static
  # credentials, or a private GitHub repo (see backend/config.example.yaml).
  # ARTIFACT_S3_ACCESS_KEY / ARTIFACT_S3_SECRET_KEY / ARTIFACT_GITHUB_TOKEN:
  #   valueFrom:
  #     secretKeyRef:
  #       name: agency-secrets
  #       key: artifact-s3-access-key # / artifact-s3-secret-key / artifact-github-token

# Everything else — db, artifactLoader, nsw, authn, web (see
# backend/config.example.yaml for the full schema and every field's meaning:
# Postgres connection, the artifact loader backend (local | github | s3),
# inbound/outbound auth endpoints and client ids, officer-portal runtime
# config, request-size/timeout settings) — lives in a config.yaml mounted from
# a ConfigMap you create out-of-band (see the kubectl create configmap
# command above) and reference here:
volumes:
  - name: agency-config
    configMap:
      name: agency-config
volumeMounts:
  - name: agency-config
    mountPath: /app/config
    readOnly: true

# Run database migrations as a pre-upgrade hook before the server rolls out.
# Reuses the env above (same DB) and the same image, running /app/migrate up.
migration:
  enabled: true

# Expose the single app (portal + API on the same host). Enable the one that
# matches your platform.
#
# OpenShift Route (default):
route:
  enabled: true
  host: "agency.example.com"
  tls:
    enabled: true
    termination: edge

# Standard Kubernetes Ingress (use instead of route on non-OpenShift clusters):
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: "agency.example.com"
      paths:
        - path: "/"
          pathType: Prefix
  # TLS termination at the ingress. The portal needs HTTPS for the OIDC PKCE
  # flow (a secure context — see the chart README), so enable this on
  # non-OpenShift clusters. secretName must reference a kubernetes.io/tls Secret
  # you create out-of-band, e.g.:
  #   kubectl create secret tls nsw-agency-tls --cert=tls.crt --key=tls.key
  tls: []
  #  - secretName: nsw-agency-tls
  #    hosts:
  #      - agency.example.com
