# Override values for the NSW Agency app (single image: API + officer portal).
#   helm install agency ./agency -f values-example.yaml
#
# One image now serves both the API and the SPA from one process and one port,
# so this is a single release (there is no separate frontend deployment).
#
# Mirrors backend/.env.example AND frontend/.env.example. NON-secret config lives
# here in plain text; SECRETS (DB_PASSWORD, NSW_CLIENT_SECRET) are referenced from
# a Kubernetes Secret and must NEVER be written here. Create the Secret
# out-of-band, e.g.:
#   kubectl create secret generic agency-secrets \
#     --from-literal=db-password=... \
#     --from-literal=nsw-client-secret=... \
#     --from-literal=artifact-s3-access-key=... \
#     --from-literal=artifact-s3-secret-key=...
#
# The artifact-s3-* keys are only needed when the artifact loader uses S3/R2 with
# static credentials (see the ARTIFACT_* env below).
#
# The https:// URLs and *_CLIENT_ID / *_OU values below are placeholders —
# replace them with your environment's real IdP and NSW API endpoints.

replicaCount: 1

image:
  repository: ghcr.io/opennsw/agency
  # Required — pick the app version to deploy. There is no default; the chart
  # fails to render if this is unset (appVersion is metadata, not the image tag).
  tag: "0.1.0"

# The server listens here (matches PORT below and EXPOSE in the root Dockerfile).
# It serves both the API and the officer portal on this single port.
containerPort: 8081

service:
  type: ClusterIP
  port: 80

# Static config files mounted into the container from a Helm-managed
# ConfigMap (see agency/values.yaml: configFiles / configFilesMountPath).
# The content below is NPQS's config (backend/config/npqs/) — a concrete
# example for this repo's own agency. Another agency (see
# docs/agency-tasks/) would substitute the JSON from its own
# backend/config/<agency>/ directory here instead. Non-secret, so it is
# fine to inline in plain text like the rest of this file.
configFiles:
  consignment-custom-data-schema.json: |
    {
      "type": "object",
      "properties": {
        "officeLocation": {
          "type": "string",
          "description": "Pushed from the applicant's nppo_office_location field by npqs_application_review_v1's consignmentFields rule. Office 1: Katunayake. Office 2: Head Office (Colombo). Office 3: Port of Colombo. Office 4: Hambantota Port. Office 5: Mattala Airport. Office 6: Jaffna Airport.",
          "enum": ["Office 1", "Office 2", "Office 3", "Office 4", "Office 5", "Office 6"]
        }
      },
      "additionalProperties": false
    }
  data-scope-rules.json: |
    {
      "rules": [
        {
          "consignmentField": "/officeLocation",
          "userField": "/assignedOffice"
        }
      ]
    }
  user-custom-data-schema.json: |
    {
      "type": "object",
      "required": ["assignedOffice"],
      "properties": {
        "assignedOffice": {
          "type": "string",
          "description": "The NPQS office this officer is assigned to, matching consignments' officeLocation values (see consignment-custom-data-schema.json) so data scoping (docs/data-scoping.md) can compare them. Office 1: Katunayake. Office 2: Head Office (Colombo). Office 3: Port of Colombo. Office 4: Hambantota Port. Office 5: Mattala Airport. Office 6: Jaffna Airport.",
          "enum": ["Office 1", "Office 2", "Office 3", "Office 4", "Office 5", "Office 6"]
        }
      },
      "additionalProperties": false
    }

env:
  PORT: "8081"
  # Request size and timeout settings (helps protect against slowloris / stalled clients)
  MAX_REQUEST_BYTES: "33554432"
  SERVER_READ_HEADER_TIMEOUT: "5s"
  SERVER_READ_TIMEOUT: "15s"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "60s"

  # --- Database (PostgreSQL) ---
  DB_DRIVER: "postgres"
  DB_HOST: "nsw-db"            # Postgres Service name in the cluster
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "nsw_agency_db"
  DB_SSLMODE: "disable"        # set to "require" when the DB enforces TLS
  # SECRET — pulled from a Kubernetes Secret, never inlined.
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: db-password

  MIGRATION_DIR: "/app/migrations"

  # --- Static config files (see configFiles above) ---
  # Optional deployment-level schema/rules, read once at startup — not
  # per-task/versioned, so they don't go through the artifact loader below.
  CONSIGNMENT_CUSTOM_DATA_SCHEMA_PATH: "/app/config/consignment-custom-data-schema.json"
  DATA_SCOPE_RULES_PATH: "/app/config/data-scope-rules.json"
  # Read by the nswac CLI (kubectl exec into the pod), not the server itself.
  USER_CUSTOM_DATA_SCHEMA_PATH: "/app/config/user-custom-data-schema.json"
  # The portal and API share one origin now, so browser→API calls are
  # same-origin (no CORS preflight). Keep this scoped to the public host.
  ALLOWED_ORIGINS: "https://agency.example.com"

  # --- Artifact loader: task configs, forms, and manifest.json ---
  # These are NO LONGER baked into the image; they are fetched at runtime from an
  # external source. ARTIFACT_LOADER_TYPE picks the backend (local | github | s3)
  # and only the selected backend's vars are read. Use "github" (pinned to an
  # immutable ref) or "s3" (e.g. Cloudflare R2) in a cluster — "local" only works
  # with a mounted volume. See backend/.env.example for the complete set.
  ARTIFACT_LOADER_TYPE: "s3"
  ARTIFACT_S3_BUCKET: "one-trade-artifacts"
  ARTIFACT_S3_REGION: "auto"                # "auto" for R2
  ARTIFACT_S3_ENDPOINT: "https://<accountid>.r2.cloudflarestorage.com"
  ARTIFACT_S3_PREFIX: "fcau"                # in-bucket key prefix (empty = root)
  # Static S3/R2 credentials — SECRETS, pulled from the Kubernetes Secret. Set
  # both or neither; omit both to fall back to the pod's default AWS credential
  # chain (IRSA / instance profile). R2 requires static keys, so keep these.
  ARTIFACT_S3_ACCESS_KEY:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: artifact-s3-access-key
  ARTIFACT_S3_SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: artifact-s3-secret-key
  # For a GitHub source instead of S3, comment out the ARTIFACT_S3_* block above
  # and use:
  #   ARTIFACT_LOADER_TYPE: "github"
  #   ARTIFACT_GITHUB_OWNER: "OpenNSW"
  #   ARTIFACT_GITHUB_REPO: "one-trade-artifacts"
  #   ARTIFACT_GITHUB_REF: "<tag-or-sha>"      # prefer an immutable tag/SHA
  #   ARTIFACT_GITHUB_BASE_PATH: "fcau"        # optional in-repo prefix
  # For a private repo (or to lift the unauthenticated rate limit), the token is
  # a SECRET — pull it from the Kubernetes Secret rather than inlining it:
  #   ARTIFACT_GITHUB_TOKEN:
  #     valueFrom:
  #       secretKeyRef:
  #         name: agency-secrets
  #         key: artifact-github-token

  # --- Inbound auth: tokens this backend accepts ---
  AUTH_JWKS_URL: "https://idp.example.com/oauth2/jwks"
  AUTH_ISSUER: "https://idp.example.com"
  AUTH_AUDIENCE: "https://api.nsw-agency.local"
  AUTH_CLIENT_IDS: "<SPA_AGENCY_PORTAL>,<M2M_NSW_TO_AGENCY>"
  AUTH_EXPECTED_OU: "<AGENCY_OU_HANDLE>"
  AUTH_JWKS_INSECURE_SKIP_VERIFY: "false"   # DEV-ONLY true; keep false in prod

  # --- Outbound auth: this backend calling the NSW API ---
  NSW_API_BASE_URL: "https://nsw-api.example.com"
  NSW_CLIENT_ID: "<M2M_AGENCY_TO_NSW>"
  # SECRET — pulled from a Kubernetes Secret, never inlined.
  NSW_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: agency-secrets
        key: nsw-client-secret
  NSW_TOKEN_URL: "https://idp.example.com/oauth2/token"
  NSW_SCOPES: "nsw:task:write,nsw:consignment:read,nsw:storage:read,nsw:storage:write"
  # Extra token-request parameters, query-string encoded (sent in the request body).
  # NSW's IdP requires an RFC 8707 `resource` indicator on scope-bearing requests.
  NSW_TOKEN_PARAMS: "resource=https://api.nsw-srilanka.local"
  NSW_TOKEN_INSECURE_SKIP_VERIFY: "false"   # DEV-ONLY true; keep false in prod

  # --- Officer portal runtime config ---
  # The server emits these to the browser at /runtime-env.js (no entrypoint
  # script). All public SPA config — no secrets. WEB_DIR is omitted: it defaults
  # to "web", which is where the root Dockerfile copies the built SPA (/app/web).
  VITE_BRANDING_NAME: "default"
  # Browser-facing API base URL. Same origin as the portal now, so it is just the
  # public host below (NOT the in-cluster Service name).
  VITE_API_BASE_URL: "https://agency.example.com"
  VITE_IDP_BASE_URL: "https://idp.example.com"
  VITE_IDP_CLIENT_ID: "<AGENCY_PORTAL_CLIENT_ID>"
  VITE_APP_URL: "https://agency.example.com"
  VITE_IDP_SCOPES: "openid,profile,email,ou,role,agency:application:read,agency:application:review,agency:application:feedback,agency:consignment:read,agency:storage:read,agency:storage:write"
  # Extra /authorize parameters. The `resource` value must equal AUTH_AUDIENCE above,
  # or the agency:* scopes are dropped from the issued token.
  VITE_IDP_EXTRA_QUERY_PARAMS: "resource=https://api.nsw-agency.local"
  # Org/OU handle for this portal instance — must match AUTH_EXPECTED_OU above.
  VITE_IDP_EXPECTED_OU_HANDLE: "<AGENCY_OU_HANDLE>"

# Run database migrations as a pre-upgrade hook before the server rolls out.
# Reuses the env above (same DB) and the same image, running /app/migrate up.
migration:
  enabled: true

# Expose the single app (portal + API on the same host). Enable the one that
# matches your platform.
#
# OpenShift Route (default):
route:
  enabled: true
  host: "agency.example.com"
  tls:
    enabled: true
    termination: edge

# Standard Kubernetes Ingress (use instead of route on non-OpenShift clusters):
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: "agency.example.com"
      paths:
        - path: "/"
          pathType: Prefix
  # TLS termination at the ingress. The portal needs HTTPS for the OIDC PKCE
  # flow (a secure context — see the chart README), so enable this on
  # non-OpenShift clusters. secretName must reference a kubernetes.io/tls Secret
  # you create out-of-band, e.g.:
  #   kubectl create secret tls nsw-agency-tls --cert=tls.crt --key=tls.key
  tls: []
  #  - secretName: nsw-agency-tls
  #    hosts:
  #      - agency.example.com
