apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: nsw-agency-portal

endpoints:
  - name: web
    port: 80
    type: HTTP
    basePath: /
    visibility:
      - external

configurations:
  env:
    - name: VITE_BRANDING_NAME
      value: default
    - name: VITE_API_BASE_URL
      value: http://localhost:8081
    - name: VITE_IDP_BASE_URL
      value: https://localhost:8090
    - name: VITE_IDP_CLIENT_ID
      value: ''
    - name: VITE_IDP_EXPECTED_OU_HANDLE
      value: ''
    - name: VITE_APP_URL
      value: http://localhost:5174
    - name: VITE_IDP_SCOPES
      value: openid,profile,email,ou,role,agency:application:read,agency:application:review,agency:application:feedback,agency:consignment:read,agency:storage:read,agency:storage:write
    # The `resource` value must equal AUTH_AUDIENCE, or the agency:* scopes are dropped.
    - name: VITE_IDP_EXTRA_QUERY_PARAMS
      value: resource=https://api.nsw-agency.local
