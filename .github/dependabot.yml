version: 2

updates:
  # Go module dependencies (backend/)
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    commit-message:
      prefix: build
      include: scope
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      gorm:
        patterns:
          - "gorm.io/*"
      opennsw:
        patterns:
          - "github.com/OpenNSW/*"
      # Long tail: bundle minor/patch into one PR.
      # Majors of ungrouped modules still arrive as individual PRs for review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: build
      include: scope
    groups:
      # Peer-coupled packages — must bump in lockstep, even on majors.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/*"
          - "tailwindcss"
      eslint-ecosystem:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
      # Long tail (typescript, radix-ui, zod, i18next, jsonforms, …):
      # one PR for minor/patch. Majors of ungrouped packages still arrive
      # as individual PRs for review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker base images
  #   / -> node:22-alpine3.24, golang:1.27-alpine3.24, alpine:3.24
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The golang builder tag must move together with the `go` directive in
      # backend/go.mod, and the gomod ecosystem never bumps that directive —
      # so letting docker bump `golang` alone would desync the two one-sidedly.
      # Bump both by hand, in one commit. See the FROM line in the Dockerfile.
      - dependency-name: "golang"
    groups:
      # Bundle minor/patch base-image bumps; major base-image jumps
      # (e.g. node 22 -> 24) still arrive individually for review.
      minor-and-patch:
        update-types:
          - minor
          - patch
