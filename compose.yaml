# Local/dev orchestration for the NSW Agency stack.
#
# Startup order is enforced by depends_on conditions:
#   db (healthy) -> migrate (runs `migrate up`, exits 0) -> server (API + portal)
#
# The whole app is now ONE image (root Dockerfile): the server binary serves the
# API and the officer-portal SPA from the same port. There is no separate
# frontend container.
#
# The migrate service is one-shot: it applies pending migrations and exits.
# Seeing it as "exited (0)" in `docker compose ps` is expected, not an error.
# The server will not start until migrate has completed successfully.
#
# NOTE: the frontend and backend authenticate against an external IdP
# (idpBaseURL / jwksURL in deployments/compose/config.yaml, default
# https://localhost:8090) that is NOT part of this compose. The UI loads, but
# login requires that IdP reachable.
#
# Usage (.env is the auto-loaded name, so no --env-file flag is needed):
#   cp .env.example .env                     # the ONE self-contained env file
#   docker compose up --build
#
# Root .env provides the values compose interpolates (${AGENCY_PORT}, ${DB_*})
# and the secrets (DB_PASSWORD, NSW_CLIENT_SECRET) the server's config.yaml
# resolves via "{{env:NAME}}". Everything else the server reads —
# db/artifactLoader/nsw/authn/web settings — comes from
# deployments/compose/config.yaml, bind-mounted read-only into the container
# (see the server service below); it's a static file, so it can't be
# templated per .env the way the old environment: overrides were — see that
# file's own comments for what has to be kept in sync by hand.
# backend/.env and frontend/.env are NOT used here — they exist only for
# bare-metal `go run` / `pnpm dev` (see start-dev.sh / backend/config.yaml).

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nsw_agency_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nsw_agency_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate", "up"]
    # cmd/migrate reads config.yaml the same way cmd/server does (same file,
    # same CONFIG_PATH default) — only the DB_PASSWORD secret comes from
    # here, resolved via config.yaml's db.postgres.password "{{env:DB_PASSWORD}}"
    # reference; the connection settings are in the mounted config.yaml below,
    # shared with the server service, so there's nothing to keep in sync here.
    env_file:
      - .env
    volumes:
      - ./deployments/compose/config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    # Only the secrets config.yaml resolves via "{{env:NAME}}" (DB_PASSWORD,
    # NSW_CLIENT_SECRET) come from here now — everything else, including
    # environment: development (dev quickstart only — required for the
    # insecure-TLS flags below to be honored), is in the mounted config.yaml.
    env_file:
      - .env
    volumes:
      - ./deployments/compose/config.yaml:/app/config.yaml:ro
    # host.docker.internal is automatic on Docker Desktop; this makes it resolve
    # on Linux / CI as well.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host port is overridable via AGENCY_PORT; the container always listens
    # on 8081 (deployments/compose/config.yaml's port) since that file can't
    # be templated per .env — see its own comments.
    ports:
      - "${AGENCY_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
